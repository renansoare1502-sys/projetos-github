<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora</title>
  <style>
    body{
  display: grid;
  justify-content: center;
  align-items: center;
  margin: 0px;
  background-color: #2c3e50;
}
.container{
  background-color: #000;
  padding: 25px;
  border-radius: 20px;
  width: 300px;
  box-shadow: 0 20px 30px rgba(0,0,0,1); 
  margin-top: 60px;
}
#display{
  width: 90%;
  height: 60px;
  margin-bottom: 20px;
  font-size: 30px;
  text-align: right;
  border: none;
  outline: none;
  padding: 10px;
  color: #ffffff;
}
.botões{
  margin-left: 9px;
}
button:active{
  filter: brightness(1,5%);
}
button{
  padding: 23px;
  margin: 5px;
  border-radius: 30px;
}
button[onclick*="Inserir"]{
background-color: #333;
  color: white;
  font-size: 17px;
  
}
button[onclick*="limpar"]{
  background-color: red;
  color: white;
  font-size: 19px;
  
}
button[onclick*='+'],
button[onclick*="-"],
button[onclick*='<'],
button[onclick*="*"],
button[onclick*="/"],
button[onclick*='calcular']{
  background-color: orange;
  color: white;
}
button[onclick*="calcular('=')"]{
  font-size: 20px;
  height: 300px;
}
button[onclick*="Inserir('.')"]{
  margin-right: 24px;
}
button[onclick*="Inserir('0')"]{
   width: 140px;
  border-radius: 30px;
}
  




  </style>
</head>
<body>
  <div class="container">
    <input type="text" id='display' disabled/>
    <div class="botões">
    <p id="resultado"></p>
     <button onclick="limpar()">C</button>
    <button onclick="Inserir('/')">/</button>
    <button onclick="Inserir('<')">< </button>
    <button onclick="Inserir('*')">X</button>
    <br>
    <button onclick="Inserir('7')">7</button>
    <button onclick="Inserir('8')">8</button>  
  <button onclick="Inserir('9')">9</button>
     <button
onclick="Inserir('-')"> -</button>
    <br>
    <button onclick="Inserir('4')">4</button>
    <button onclick="Inserir('5')">5</button>  
    <button onclick="Inserir('6')">6</button>
    <button 
onclick="Inserir('+')">+</button>
    <br>
    <button onclick="Inserir('1')">1</button>
    <button onclick="Inserir('2')">2</button>
    <button
onclick="Inserir('3')">3</button>
    <button onclick="calcular()">=</button>
    
    <br>
    
    <button onclick="Inserir('0')">0</button>
    <button onclick="Inserir('.')">.</button>
    </div>
</div>
  <script>
    function Inserir(valor) {
    // 1. Tenta achar o visor pelo ID 'display' que você usou no HTML
    var display = document.getElementById('display');

    // 2. Se ele achar o visor, ele coloca o valor lá
    if (display) {
        display.value += valor;
    } else {
        // Se der erro, ele te avisa no console qual o problema
        console.error("O JavaScript não achou o ID 'display' no seu HTML!");
    }
}

function limpar() {
    // Apaga tudo o que está no visor
    document.getElementById('display').value = '';
}

function calcular() {
    var display = document.getElementById('display');
    // Resolve a conta matemática que estiver escrita no visor
    display.value = eval(display.value);
}

  </script>
</body>
</html>
